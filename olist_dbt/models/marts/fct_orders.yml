version: 2

models:
  - name: fct_orders
    description: "Order-level fact table. One row per order."

    columns:
      - name: order_id
        tests:
          - not_null

      - name: customer_id
        tests:
          - not_null

      - name: order_status
        tests:
          - not_null

      - name: total_order_value
        tests:
          - not_null
