version: 2

models:
  - name: fct_sales
    description: "Sales fact table at order-item grain."

    columns:
      - name: order_id
        tests:
          - not_null

      - name: order_item_id
        tests:
          - not_null

      - name: product_id
        tests:
          - not_null

      - name: seller_id
        tests:
          - not_null
